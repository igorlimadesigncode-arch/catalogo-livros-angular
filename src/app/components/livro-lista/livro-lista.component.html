<main class="container-fluid py-2">
  <h1 class="h2 mb-2">Catálogo de Livros</h1>
  <div class="table-responsive">
    <table class="table table-striped table-sm align-middle">
      <thead class="table-dark">
        <tr>
          <th scope="col">Título</th>
          <th scope="col">Resumo</th>
          <th scope="col">Editora</th>
          <th scope="col">Autores</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let livro of livros">
          <td>
            <div>{{ livro.titulo }}</div>
            <button type="button" class="btn btn-danger btn-sm mt-1" (click)="excluir(livro.codigo)" [attr.aria-label]="'Excluir ' + livro.titulo">Excluir</button>
          </td>
          <td>{{ livro.resumo }}</td>
          <td>{{ obterNome(livro.codEditora) }}</td>
          <td>
            <ul class="book-authors">
              <li *ngFor="let autor of livro.autores">{{ autor }}</li>
            </ul>
          </td>
        </tr>
        <tr *ngIf="livros.length === 0">
          <td colspan="4" class="text-center text-muted py-4">Nenhum livro cadastrado.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
